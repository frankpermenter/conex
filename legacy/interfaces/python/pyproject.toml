[build-system]
requires = [
  "scikit-build-core>=0.10",
  "pybind11>=2.13",
]
build-backend = "scikit_build_core.build"

[project]
name = "conex-python"
version = "0.1.0"
description = "Python bindings for Conex via pybind11"
requires-python = ">=3.9"

[tool.scikit-build]
cmake.minimum-version = "3.20"
build-dir = "build/{wheel_tag}"

